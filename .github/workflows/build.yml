name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-14
            name: macos-arm64
          - os: windows-latest
            name: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Dependencies ---- #

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev opencl-headers ocl-icd-opencl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl3 dylibbundler
        # OpenCL ships as a system framework on macOS, nothing to install.
        # "sdl2" is actually sdl2-compat, a shim that dlopen()s the real sdl3
        # at runtime instead of linking it (see "Bundle dylibs" below).
        # dylibbundler is used after the build to make the app relocatable.

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sdl2:x64-windows opencl:x64-windows

      # ---- Configure ---- #

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      # ---- Build ---- #

      - name: Build
        run: cmake --build build --config Release --parallel

      # ---- Make the build relocatable (so it runs on a machine without ---- #
      # ---- Homebrew/vcpkg installed) ---- #

      - name: Bundle dylibs (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p build/bin/libs

          # sdl2-compat (what "brew install sdl2" ships) doesn't link SDL3 as
          # a normal dependency; it dlopen()s it by name at runtime, trying
          # "@loader_path/libSDL3.dylib" first (i.e. next to whichever dylib
          # is doing the loading). otool -L never sees this, so dylibbundler
          # can't discover or bundle it on its own — drop a real copy exactly
          # where it will look.
          cp -L "$(brew --prefix sdl3)/lib/libSDL3.dylib" build/bin/libs/libSDL3.dylib

          # Homebrew's SDL2 (and SDL3) are shared dylibs referenced by their
          # absolute /opt/homebrew (or /usr/local) install path, which only
          # exists on the machine that built them. dylibbundler copies them
          # (and their own dependencies) next to the executable and rewrites
          # the load commands to use a relative @executable_path, so the app
          # runs on any Mac.
          #
          # NOTE: -od (--overwrite-dir) erases build/bin/libs/ before doing
          # anything else, which would delete the libSDL3.dylib we just
          # copied in above (dylibbundler then fails trying to chmod a file
          # it just deleted). Use -of/-cd instead: they allow overwriting
          # individual files and creating the dir if missing, without
          # wiping out what's already there.
          dylibbundler -of -cd -b \
            -x build/bin/VoxRay \
            -x build/bin/libs/libSDL3.dylib \
            -d build/bin/libs \
            -p @executable_path/libs/

          # Re-sign after dylibbundler rewrote load commands: unsigned/stale
          # signatures are rejected at launch on Apple Silicon.
          codesign --force -s - build/bin/libs/*.dylib
          codesign --force -s - build/bin/VoxRay

      - name: Bundle DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/SDL2.dll" -Destination build/bin/
        # SDL2 is linked dynamically; ship SDL2.dll next to the executable so
        # it runs on a machine without SDL2 installed. OpenCL.dll is not
        # bundled: it is provided by the GPU vendor's driver and must already
        # be present on the target machine.

      # ---- Package & upload ---- #

      - name: Stage build output
        shell: bash
        run: |
          mkdir -p dist/VoxRay-${{ matrix.name }}
          cp -r build/bin/. dist/VoxRay-${{ matrix.name }}/
          # ressources/ is already inside build/bin/ (see CMakeLists.txt) and
          # was just copied above alongside the executable.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxRay-${{ matrix.name }}
          path: dist/VoxRay-${{ matrix.name }}
          if-no-files-found: error
