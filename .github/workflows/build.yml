name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Dependencies ---- #

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev opencl-headers ocl-icd-opencl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2
        # OpenCL ships as a system framework on macOS, nothing to install.

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sdl2:x64-windows opencl:x64-windows

      # ---- Configure ---- #

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      # ---- Build ---- #

      - name: Build
        run: cmake --build build --config Release --parallel

      # ---- Package & upload ---- #

      - name: Stage build output
        shell: bash
        run: |
          mkdir -p dist/VoxRay-${{ matrix.name }}
          cp -r build/bin/. dist/VoxRay-${{ matrix.name }}/
          cp -r build/ressources dist/VoxRay-${{ matrix.name }}/ressources

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxRay-${{ matrix.name }}
          path: dist/VoxRay-${{ matrix.name }}
          if-no-files-found: error
