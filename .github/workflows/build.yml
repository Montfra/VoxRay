name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-13
            name: macos-intel
          - os: macos-14
            name: macos-arm64
          - os: windows-latest
            name: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Dependencies ---- #

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev opencl-headers ocl-icd-opencl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 dylibbundler
        # OpenCL ships as a system framework on macOS, nothing to install.
        # dylibbundler is used after the build to make the app relocatable
        # (see "Bundle dylibs" below).

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sdl2:x64-windows opencl:x64-windows

      # ---- Configure ---- #

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      # ---- Build ---- #

      - name: Build
        run: cmake --build build --config Release --parallel

      # ---- Make the build relocatable (so it runs on a machine without ---- #
      # ---- Homebrew/vcpkg installed) ---- #

      - name: Bundle dylibs (macOS)
        if: runner.os == 'macOS'
        run: |
          dylibbundler -od -b \
            -x build/bin/VoxRay \
            -d build/bin/libs \
            -p @executable_path/libs/
        # Homebrew's SDL2 is a shared dylib referenced by its absolute
        # /opt/homebrew (or /usr/local) install path, which only exists on the
        # machine that built it. dylibbundler copies it (and its own
        # dependencies) next to the executable and rewrites the load commands
        # to use a relative @executable_path, so the app runs on any Mac.

      - name: Bundle DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/SDL2.dll" -Destination build/bin/
        # SDL2 is linked dynamically; ship SDL2.dll next to the executable so
        # it runs on a machine without SDL2 installed. OpenCL.dll is not
        # bundled: it is provided by the GPU vendor's driver and must already
        # be present on the target machine.

      # ---- Package & upload ---- #

      - name: Stage build output
        shell: bash
        run: |
          mkdir -p dist/VoxRay-${{ matrix.name }}
          cp -r build/bin/. dist/VoxRay-${{ matrix.name }}/
          cp -r build/ressources dist/VoxRay-${{ matrix.name }}/ressources

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxRay-${{ matrix.name }}
          path: dist/VoxRay-${{ matrix.name }}
          if-no-files-found: error
